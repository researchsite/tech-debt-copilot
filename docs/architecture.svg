  <text x="55" y="353" fill="#8eabc5" font-size="8.5">💬  Natural language chat</text>
  <text x="55" y="369" fill="#8eabc5" font-size="8.5">🖥  Local machine scan</text>
  <text x="55" y="385" fill="#8eabc5" font-size="8.5">🔗  GitHub URL scan</text>
  <text x="55" y="401" fill="#8eabc5" font-size="8.5">📄  Paste pip list output</text>
  <text x="55" y="417" fill="#8eabc5" font-size="8.5">📁  Local folder scan</text>

