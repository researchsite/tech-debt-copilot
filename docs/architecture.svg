  <text x="665" y="457" text-anchor="middle" fill="#eaf0f8" font-size="10" font-weight="700">GitHub raw.githubusercontent.com</text>
  <text x="665" y="473" text-anchor="middle" fill="#6b84a0" font-size="8.5">requirements.txt · package.json · go.mod · .nvmrc</text>

