  <text x="120" y="102" text-anchor="middle" fill="#4fd9df" font-size="9" font-weight="700" letter-spacing="1.5" font-family="'DM Mono', monospace">USER LAYER</text>

  <!-- Browser box -->
  <rect x="45" y="112" width="150" height="80" rx="8" fill="url(#uiGrad)" stroke="#2a4560" stroke-width="1"/>
  <text x="120" y="130" text-anchor="middle" fill="#eaf0f8" font-size="11" font-weight="700">Streamlit UI</text>
  <text x="120" y="147" text-anchor="middle" fill="#6b84a0" font-size="9">app.py</text>
  <line x1="65" y1="157" x2="175" y2="157" stroke="#1e3347" stroke-width="0.5"/>
  <text x="120" y="170" text-anchor="middle" fill="#8eabc5" font-size="8.5">Dashboard · Chat · Sidebar</text>
