  <text x="120" y="222" text-anchor="middle" fill="#eaf0f8" font-size="10" font-weight="700">Personas</text>
  <text x="55" y="240" fill="#8eabc5" font-size="8.5">⚙  DevOps Engineer</text>
  <text x="55" y="256" fill="#8eabc5" font-size="8.5">🔒  Security Team</text>
  <text x="55" y="272" fill="#8eabc5" font-size="8.5">📋  IT Asset Manager</text>
  <text x="55" y="288" fill="#8eabc5" font-size="8.5">⚛  Frontend / Mobile Dev</text>
