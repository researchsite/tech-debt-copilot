  <!-- User → Agent (scan) -->
  <path d="M 210 250 L 240 210" stroke="#f07235" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="220" y="240" text-anchor="middle" fill="#f07235" font-size="7">scan</text>

  <!-- Agent → Atlas (vector search) -->
  <path d="M 495 276 L 540 220" stroke="#4fd9df" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="515" y="245" text-anchor="middle" fill="#4fd9df" font-size="7">$vectorSearch</text>

  <!-- Agent → Atlas (checkpointer) -->
  <path d="M 495 454 L 540 300" stroke="#4ecb87" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
  <text x="508" y="380" text-anchor="middle" fill="#4ecb87" font-size="7" transform="rotate(-55,508,380)">checkpoint</text>

  <!-- Agent → OSV -->
  <path d="M 495 292 L 540 398" stroke="#f07235" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)" stroke-dasharray="4,3"/>
  <text x="530" y="345" text-anchor="middle" fill="#f07235" font-size="7">CVE API</text>

  <!-- Agent → GitHub -->
  <path d="M 495 330 L 540 458" stroke="#6b84a0" stroke-width="1.2" fill="none" marker-end="url(#arrow-muted)" stroke-dasharray="4,3"/>
  <text x="520" y="400" text-anchor="middle" fill="#6b84a0" font-size="7">HTTP fetch</text>

  <!-- Atlas → Voyage label -->
