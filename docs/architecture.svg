  <text x="665" y="205" text-anchor="middle" fill="#6b84a0" font-size="8">Voyage AI embeddings · 1024-dim · cosine</text>

  <rect x="565" y="224" width="200" height="40" rx="6" fill="#0d2a1a" stroke="#1a3a1a" stroke-width="1"/>
