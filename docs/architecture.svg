  <line x1="726" y1="604" x2="750" y2="604" stroke="#4ecb87" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="756" y="608" fill="#6b84a0" font-size="8">Persistence (MongoDBSaver)</text>
