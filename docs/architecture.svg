  <rect x="375" y="308" width="120" height="36" rx="6" fill="#0f2236" stroke="#1e3347" stroke-width="1"/>
  <text x="435" y="322" text-anchor="middle" fill="#4fd9df" font-size="8.5" font-weight="700">analyze_industry_trends</text>
  <text x="435" y="335" text-anchor="middle" fill="#6b84a0" font-size="7.5">$group · $count · category</text>

