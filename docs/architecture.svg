  <rect x="565" y="163" width="200" height="52" rx="6" fill="#0d2a1a" stroke="#1a3a1a" stroke-width="1"/>
  <text x="665" y="179" text-anchor="middle" fill="#eaf0f8" font-size="9" font-weight="700">eol_lifecycle collection</text>
