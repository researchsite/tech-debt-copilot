  <text x="665" y="254" text-anchor="middle" fill="#6b84a0" font-size="8">LangGraph thread state · per thread_id</text>

  <rect x="565" y="273" width="200" height="8" rx="4" fill="#1a3a1a"/>

  <!-- Voyage AI -->
  <rect x="555" y="302" width="220" height="62" rx="8" fill="#0f1e2a" stroke="#4fd9df" stroke-width="1"/>
  <text x="665" y="320" text-anchor="middle" fill="#eaf0f8" font-size="10" font-weight="700">Voyage AI</text>
  <text x="665" y="336" text-anchor="middle" fill="#4fd9df" font-size="9" font-family="'DM Mono', monospace">voyage-3.5 · 1024-dim</text>
  <text x="665" y="352" text-anchor="middle" fill="#6b84a0" font-size="8">input_type=document (index) · query (search)</text>

